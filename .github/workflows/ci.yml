name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile-app:
    name: Mobile app – typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  data-creator:
    name: Data creator – typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/data-creator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/data-creator/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
